name: Content READMEs

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify README generation
        run: python3 .github/scripts/verify_readmes.py

  generate:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: generate-content-readmes
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Generate missing READMEs
        run: python3 .github/scripts/generate_readmes.py
      - name: Commit generated READMEs
        run: |
          git add -- '**/README.md'
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: add missing content READMEs [skip ci]'
          git push origin HEAD:main
